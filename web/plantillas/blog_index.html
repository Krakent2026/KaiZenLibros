{% extends "base.html" %}
{% block contenido %}
<section class="estrecho">
  <p class="sobre">Blog</p>
  <h1>Ideas de los libros, una cada vez</h1>
  <ul class="lista-posts grande con-cabecera">
    {% for p in posts %}
    <li>
      <a href="{{ u(p.ruta) }}">{{ cabecera_post(p) }}<span class="lista-posts__titulo">{{ p.titulo }}</span></a>
      <time datetime="{{ p.fecha }}">{{ p.fecha.strftime('%d/%m/%Y') }}</time>
      {% if p.resumen %}<p>{{ p.resumen }}</p>{% endif %}
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
