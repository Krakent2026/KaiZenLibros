{% extends "base.html" %}
{% block contenido %}
<section class="estrecho">
  <p class="sobre">Blog</p>
  <h1>Ideas de los libros, una cada vez</h1>
  <ul class="lista-posts grande">
    {% for p in posts %}
    <li>
      <time datetime="{{ p.fecha }}">{{ p.fecha.strftime('%d/%m/%Y') }}</time>
      <h2><a href="{{ u(p.ruta) }}">{{ p.titulo }}</a></h2>
      {% if p.resumen %}<p>{{ p.resumen }}</p>{% endif %}
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
