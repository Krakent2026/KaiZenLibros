  # Series siguientes. Se activan en Fase 2 rellenando la lista de libros (mismo esquema).
  numeros_del_alma:
    activa: false
    nombre_amazon: Los números del alma
    carpeta: 3.Numerologia
    tipo: ordenada
    frase: "Aquí no se predice, no se diagnostica y no se promete nada."
    libros: []
  espiritualidad_sin_doctrina:
    activa: false
    nombre_amazon: Espiritualidad sin doctrina
    carpeta: "6. Espiritualidad sin doctrina"
    tipo: ordenada
    frase: "Creer sin perder la cabeza."
    libros: []
  crecimiento_personal:
    activa: true
    nombre_amazon: Crecimiento personal
    carpeta: 0.Crecimiento Personal
    tipo: ordenada
    frase: "No hace falta arreglarte. Hace falta mirarte, y luego moverte un poco."
    promesa: "Entenderte mejor y mover algo pequeño, hoy, en la dirección correcta. El resto lo hace la repetición."
    enemigo: "Los gurús, las promesas de treinta días, la disciplina como castigo y el descanso como premio que hay que merecer."
    descripcion_corta: >
      Veintiún libros de crecimiento personal escritos sin gurús y sin promesas: autoconocimiento, calma
      mental, hábitos, límites, descanso y sentido. Cada uno se lee suelto y va al grano, con algo concreto
      que hacer en cada capítulo. No propone transformarte en treinta días: propone entenderte mejor y
      mover algo pequeño.
    nota_enfoque: >
      Esta colección es divulgación y acompañamiento. No es asesoramiento médico, psicológico ni
      terapéutico, y no sustituye a un profesional sanitario. Ninguna de sus prácticas funciona para todo
      el mundo ni todos los días. En España: 024 (conducta suicida, 24 h), 112 (emergencias), 016 (violencia de género).
    palabras_clave: [crecimiento personal, hábitos y disciplina, calma mental y mindfulness, autoestima y límites, desarrollo personal español, colección crecimiento personal, bienestar sin gurús]
