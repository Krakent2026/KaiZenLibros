  los_mensajeros:
    activa: true
    nombre_amazon: Los Mensajeros
    carpeta: "2. Los mensajeros"
    tipo: ordenada
    frase: "Ninguno vino a fundar una religión. Todos vinieron a decir algo."
    promesa: "Las vidas de las grandes figuras espirituales contadas como novelas: narrativa pura, histórica y sensorial. Una vida, una novela."
    enemigo: "El catecismo, la hagiografía y poner una fe por encima de las demás."
    descripcion_corta: >
      Las vidas de las grandes figuras espirituales de la humanidad, de Krishna a Bahá'u'lláh, de Moisés a
      Buda, de Lao Tsé a Jesús, contadas como grandes novelas. Once vidas, once libros, un mismo hilo
      secreto. Respetuosa con todas las tradiciones y sin poner ninguna por encima de otra.
    nota_enfoque: >
      Estas novelas son ficción histórica de base documental: recrean escenas, diálogos y vida interior
      que ninguna fuente registra, y por eso son novelas y no biografías. Se escriben con respeto por las
      tradiciones vivas de cada figura, sin ánimo proselitista y sin jerarquizar creencias. Las cubiertas
      no representan rostros.
    palabras_clave: [novela histórica espiritual, vidas de los profetas, historia de las religiones, biografía novelada espiritual, saga novela religiones, espiritualidad universal]
    bloques:
      - {nombre: Los antiguos, libros: [1, 2, 3], que: "Krishna, Zaratustra, Moisés."}
      - {nombre: Los maestros, libros: [4, 5, 6], que: "Buda, Lao Tsé, Confucio."}
      - {nombre: Los profetas, libros: [7, 8, 9], que: "Jesús, Muhammad, Guru Nanak."}
      - {nombre: Los modernos, libros: [10, 11], que: "El Báb, Bahá'u'lláh."}
    itinerarios:
      - {nombre: "Empieza por lo que ya conoces", libros: [7, 4, 3]}
      - {nombre: "Cronológico puro", libros: [1, 2, 3]}
      - {nombre: "Lo que no me habían contado", libros: [9, 10, 11]}
    faq:
      - {p: "¿Son biografías o novelas?", r: "Novelas. Ficción histórica de base documental: recrean escenas, diálogos y vida interior que ninguna fuente registra. Por eso son novelas y no biografías."}
      - {p: "¿Hay que leerlas en orden?", r: "No. El orden es cronológico, pero cada novela es autoconclusiva y ninguna da por supuesto que hayas leído las otras. Muchos lectores entran por Jesús o por Buda."}
      - {p: "¿Defienden alguna religión?", r: "Ninguna. La serie no pone una tradición por encima de otra y no tiene ánimo proselitista. Quien busque la confirmación de que su fe es la verdadera saldrá decepcionado, y ese es el propósito."}
      - {p: "¿Por qué las cubiertas no tienen rostros?", r: "Por deferencia a las tradiciones que no admiten representar a sus figuras. Es una cuestión de respeto, no de estilo."}
