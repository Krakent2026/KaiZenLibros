plan:
  zona_horaria: Europe/Madrid
  # Formatos por día de la semana (0 = lunes). Cada entrada es una pieza; el orden fija la hora.
  # Formatos: carrusel (7 imágenes), cita (1 imagen), audio (episodio de pódcast de ~5 min + imagen)
  semana:
    0: [carrusel, cita]
    1: [cita, cita]
    2: [audio, cita]
    3: [cita, cita]
    4: [carrusel, cita]
    5: [cita]
    6: [cita]
  horas: ["12:30", "19:00"]
  # Si el Estratega ha dejado un plan para la semana (kv plan_semana:<lunes>), manda sobre `semana`.
  usar_plan_estratega: true
  # Piezas institucionales (formatos `sello` = qué escribe Kai Zen; `serie` = presentación de una serie).
  # Arranque: se consume UNA por día en el primer hueco del día, hasta agotar la lista. Después, una cada
  # `institucional_cada_dias` alternando sello/serie. Se alternan así con las piezas de libro.
  arranque:
    - {formato: sello, angulo: "Qué escribe Kai Zen y la regla que no se rompe en ningún libro: no diagnostica, no predice, no promete. Series cerradas y ordenadas, con puerta de entrada."}
    - {formato: serie, serie: mente_distinta, angulo: "Presentación de Mente distinta: doce libros para cerebros que funcionan distinto, cuatro bloques (entender, organizarte, sentir, convivir), empieza por el Libro 1."}
    - {formato: sello, angulo: "Lo que estos libros se niegan a decir: ni un test, ni «es un superpoder», ni cifras que no se pueden sostener. La honestidad como método."}
    - {formato: serie, serie: mente_distinta, angulo: "Cuatro formas de entrar en la serie según lo que te esté pasando: acabo de descubrirlo, no me organizo, lo llevo mal por dentro, el problema está fuera."}
    - {formato: serie, serie: crecimiento_personal, angulo: "Presentación de Crecimiento personal: veintiún libros sin gurús, sin promesas y sin culpa; cada uno se lee suelto; la puerta es «El arte de conocerte»."}
    - {formato: serie, serie: los_mensajeros, angulo: "Presentación de Los Mensajeros: las vidas de las grandes figuras espirituales contadas como novelas, una vida por libro, ninguna tradición por encima de otra; puertas de entrada: «Jesús» y «Buda»."}
    - {formato: sello, angulo: "Cómo se lee una serie de Kai Zen: cada libro es dueño de un tema, ninguno repite al anterior, y leer más no es hacer más."}
    - {formato: serie, serie: crecimiento_personal, angulo: "Cuatro formas de entrar en Crecimiento personal: no paro de darle vueltas, empiezo y no aguanto, estoy agotado, no sé qué hago con mi vida."}
    - {formato: serie, serie: los_mensajeros, angulo: "Lo que Los Mensajeros se niega a hacer: no es un catecismo ni una hagiografía; son hombres con miedo, dudas y hambre. Ficción de base documental."}
  institucional_cada_dias: 5
  # Cuántos días hacia delante se planifica (para que el humano apruebe con margen)
  dias_adelanto: 1
  max_reintentos_redaccion: 2

publicacion:
  # Canales a los que sale cada pieza. Solo actúan los que tengan credenciales en el entorno.
  canales: [telegram, pinterest, instagram, bluesky, threads, x]
  # Excepciones por formato (si no está, se usa `canales`)
  canales_por_formato:
    audio: [podcast, telegram, bluesky, threads, x]
  # Aprobación: manual (todo lo decide el humano) · mixto (se autoaprueban las citas literales sin avisos)
  # · auto (todo lo que pasa el Guardián queda aprobado). En cualquier modo la previa llega a Telegram y
  # se puede cancelar (❌) o devolver al Redactor (✏️) hasta la hora de publicación.
  aprobacion: auto
  # Minutos mínimos entre el aviso en Telegram y la publicación automática (ventana para cancelar).
  antelacion_minima_min: 60
  # Una pieza que el Guardián rechazó alguna vez nunca se autoaprueba: pasa por el humano.
  rechazadas_a_manual: true
  # Las imágenes de las piezas se publican en la web para que Instagram las pueda leer (necesita URL pública).
  ruta_piezas_web: static/piezas
  dias_conservar_piezas: 21
  hashtags_max: 8

podcast:
  titulo: "Kai Zen, cinco minutos"
  descripcion: "Una idea de un libro, leída en voz alta. Cinco minutos, sin promesas y sin prisa."
  autor: Kai Zen
  email: kaizensp1988@gmail.com
  # Dónde escucharlo (se muestran en la web; vacío = no se muestra)
  spotify: "https://open.spotify.com/show/0NZ0KZcBPU2mwNCseANNJP"
  apple: ""
  idioma: es-es
  categoria: "Self-Improvement"
  # Motor: auto = Azure Speech si hay AZURE_SPEECH_KEY (voz HD, más natural), si no Edge TTS (gratis, sin clave).
  motor: auto
  # Edge TTS. Alternativas de España: es-ES-ElviraNeural, es-ES-AlvaroNeural.
  voz: es-ES-XimenaNeural
  # Azure Speech: la misma Ximena en versión HD. Si la región no la ofrece, cae a Edge.
  voz_azure: "es-ES-Ximena:DragonHDLatestNeural"
  velocidad: "+0%"
  tono: "+0Hz"
  ruta_web: static/podcast
  aviso_voz: "Este episodio se ha grabado con una voz sintética a partir del texto del libro."

bibliotecario:
  dias_gratis_por_periodo: 5     # límite de KDP Select por libro cada 90 días
  periodo_dias: 90
  duracion_promo_dias: 2         # cada promoción: días gratis seguidos
  aviso_dias_antes: 14           # KDP pide programar con antelación; el aviso llega con este margen
  fecha_inicio_rotacion: "2026-09-22"
  tokens:
    instagram_dias_validez: 60
    aviso_dias_antes: 10

analista:
