series:
  mente_distinta:
    activa: true
    nombre_amazon: Mente distinta
    carpeta: 1.Neurodivergente
    tipo: ordenada
    frase: "Ni un test. Ni una vez «es un superpoder»."
    promesa: "Sistemas en lugar de fuerza de voluntad. Herramientas que funcionan un día malo."
    enemigo: "La autoayuda que diagnostica y el discurso del «don»."
    descripcion_corta: >
      Doce libros para cerebros que funcionan distinto: TDAH adulto, alta sensibilidad y autismo
      detectado tarde. Del «no es pereza» a criar a un hijo que procesa el mundo de otra manera.
      Sin tests, sin diagnosticar a nadie y sin llamarlo un don. Sistemas en lugar de fuerza de voluntad.
    nota_enfoque: >
      Esta colección es divulgación y acompañamiento. No diagnostica ni al lector ni a nadie de su
      entorno, no trata y no sustituye a un profesional sanitario. No contiene ningún test.
      En España: 024 (conducta suicida, 24 h), 112 (emergencias), 016 (violencia de género).
    palabras_clave:
      - TDAH adulto
      - neurodivergencia
      - alta sensibilidad PAS
      - autismo diagnosticado tarde
      - colección TDAH español
      - organización para TDAH
      - neurodivergente sin diagnóstico
    bloques:
      - {nombre: Entender, libros: [1, 2], que: "Qué es esto y qué te ha hecho creer de ti."}
      - {nombre: Organizarte, libros: [3, 4, 5], que: "Tiempo, sistemas y energía."}
      - {nombre: Sentir, libros: [6, 7, 8], que: "Intensidad, entorno y máscara."}
      - {nombre: Convivir, libros: [9, 10, 11, 12], que: "Pareja, trabajo, tu propia historia y tus hijos."}
    itinerarios:
      - {nombre: "Acabo de descubrirlo", libros: [1, 11, 2]}
      - {nombre: "No me organizo", libros: [1, 3, 4, 5]}
      - {nombre: "Lo llevo mal por dentro", libros: [6, 7, 8]}
      - {nombre: "El problema está fuera", libros: [9, 10, 12]}
    faq:
      - p: "¿Por dónde empiezo?"
        r: "Por el Libro 1, «No es pereza». Explica qué es esto por dentro y por qué la fuerza de voluntad nunca fue el problema. Los otros once remiten a él."
      - p: "¿Puedo leer solo uno?"
        r: "Sí. Cada libro es dueño de un tema y lo trata a fondo sin repetir lo que cuentan los otros. Cuando toca otro tema, remite al libro que lo desarrolla."
      - p: "¿Estos libros me dicen si tengo TDAH?"
        r: "No. Ningún libro de la serie contiene un test ni diagnostica a nadie. Reconocerse en una descripción es motivo para hacerse preguntas y, si procede, buscar una evaluación profesional; el diagnóstico lo hace alguien formado para eso."
      - p: "¿Es para mí si no tengo diagnóstico?"
        r: "La serie está escrita para adultos que procesan el mundo de otra manera, con diagnóstico, tardío o sin él. No hace falta una etiqueta para que un sistema te sirva."
      - p: "¿Hablan de medicación?"
        r: "El Libro 1 explica qué esperar de una evaluación de adulto y qué hay para tratar el TDAH, incluida la medicación, contado con neutralidad: sin venderla y sin demonizarla."
      - p: "¿Y si quien procesa distinto es mi hijo?"
        r: "El Libro 12, «Criar mentes distintas», cierra la colección y está escrito para eso. Lo dice en la primera página: cae entero sobre un menor que no ha elegido nada de esto."
      - p: "¿Hay ejercicios?"
        r: "Cada capítulo termina con «Un paso hoy»: una práctica concreta, con pocos pasos, pensada para funcionar también un día malo."
    libros:
      - {numero: 1, slug: no-es-pereza, titulo: "No es pereza", subtitulo: "TDAH adulto: por qué no es falta de voluntad", carpeta: Libro1_No_es_pereza, portada: PUBLICAR_NoEsPereza_PORTADA_EBOOK.jpg, bloque: Entender, para_que: "Empieza aquí. Qué es esto por dentro.", asin_ebook: null, asin_papel: null}
      - {numero: 2, slug: tu-cerebro-no-esta-roto, titulo: "Tu cerebro no está roto", subtitulo: "Del déficit a la diferencia", carpeta: Libro2_Tu_cerebro_no_esta_roto, portada: PUBLICAR_CerebroNoRoto_PORTADA_EBOOK.jpg, bloque: Entender, para_que: "La identidad y la vergüenza acumulada.", asin_ebook: null, asin_papel: null}
      - {numero: 3, slug: el-tiempo-no-me-obedece, titulo: "El tiempo no me obedece", subtitulo: "Vencer la procrastinación y la ceguera temporal", carpeta: Libro3_El_tiempo_no_me_obedece, portada: PUBLICAR_ElTiempo_PORTADA_EBOOK.jpg, bloque: Organizarte, para_que: "Por qué media hora dura lo que quiere.", asin_ebook: null, asin_papel: null}
      - {numero: 4, slug: sistemas-para-mentes-caoticas, titulo: "Sistemas para mentes caóticas", subtitulo: "Organización diseñada para tu cerebro, no contra él", carpeta: Libro4_Sistemas_para_mentes_caoticas, portada: PUBLICAR_Sistemas_PORTADA_EBOOK.jpg, bloque: Organizarte, para_que: "Sistemas que aguantan un día malo.", asin_ebook: null, asin_papel: null}
      - {numero: 5, slug: dopamina, titulo: "Dopamina", subtitulo: "Motivación, aburrimiento y las pantallas", carpeta: Libro5_Dopamina, portada: PUBLICAR_Dopamina_PORTADA_EBOOK.jpg, bloque: Organizarte, para_que: "De dónde sale el arranque y por qué se apaga.", asin_ebook: null, asin_papel: null}
      - {numero: 6, slug: del-caos-a-la-calma, titulo: "Del caos a la calma", subtitulo: "Regular la tormenta emocional (y la sensibilidad al rechazo)", carpeta: Libro6_Del_caos_a_la_calma, portada: PUBLICAR_DelCaosALaCalma_PORTADA_EBOOK.jpg, bloque: Sentir, para_que: "Las subidas rápidas y la reparación.", asin_ebook: null, asin_papel: null}
      - {numero: 7, slug: demasiado-intenso, titulo: "Demasiado intenso", subtitulo: "Vivir con alta sensibilidad en un mundo a todo volumen", carpeta: Libro7_Demasiado_intenso, portada: PUBLICAR_DemasiadoIntenso_PORTADA_EBOOK.jpg, bloque: Sentir, para_que: "El ruido, la luz y el presupuesto de exposición.", asin_ebook: null, asin_papel: null}
      - {numero: 8, slug: enmascarada, titulo: "Enmascarada", subtitulo: "Autismo y TDAH diagnosticados tarde: el precio de haber encajado", carpeta: Libro8_Enmascarada, portada: PUBLICAR_Enmascarada_PORTADA_EBOOK.jpg, bloque: Sentir, para_que: "La máscara y lo que cuesta sostenerla.", asin_ebook: null, asin_papel: null}
      - {numero: 9, slug: relaciones-a-otra-frecuencia, titulo: "Relaciones a otra frecuencia", subtitulo: "Vínculos, comunicación y límites para cerebros distintos", carpeta: Libro9_Relaciones_a_otra_frecuencia, portada: PUBLICAR_RelacionesAOtraFrecuencia_PORTADA_EBOOK.jpg, bloque: Convivir, para_que: "Pedir, poner límites, y que el otro también traduce.", asin_ebook: null, asin_papel: null}
