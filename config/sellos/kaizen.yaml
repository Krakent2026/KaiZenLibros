# Configuración del sello Kai Zen.
# Todo el sistema (Minero, Redactor, web, enlaces) lee de aquí. Un sello = un fichero.

sello:
  id: kaizen
  nombre: Kai Zen
  autor_amazon: Kai Zen
  tagline: "Leer más no es hacer más."
  idioma: es
  # Cambiar por el dominio propio cuando exista. Con GitHub Pages queda https://<usuario>.github.io/Promocion_IA
  web: "https://krakent2026.github.io/KaiZenLibros"
  contacto_email: ""
  voz: >
    Primera persona cercana y sin género marcado. Directa, validante, con humor seco.
    Nada clínico ni infantilizador. Sin urgencia falsa y sin promesas: se dice de qué
    trata el libro, nunca qué le hará al lector. Kai Zen es una voz de sello, no una
    persona con anécdotas: nunca se inventan vivencias personales.

ia:
  # Modelos por agente. Cambiar aquí, no en el código.
  modelo_minero: claude-sonnet-5
  modelo_redactor: claude-sonnet-5
  modelo_estratega: claude-opus-5
  modelo_guardian: claude-haiku-4-5
  esfuerzo_minero: medium
  # Precios USD por millón de tokens, para el registro de coste en la tabla ejecuciones.
  precios:
    claude-opus-5: {entrada: 5.0, salida: 25.0}
    claude-sonnet-5: {entrada: 2.0, salida: 10.0}
    claude-haiku-4-5: {entrada: 1.0, salida: 5.0}

fuentes:
  # Los manuscritos NO van al repositorio. Se leen de esta raíz (variable de entorno o ruta relativa al repo).
  raiz_env: KAIZEN_FUENTES
  raiz_por_defecto: "../8.Espiritualidad"
  manuscrito: 11_Version_Definitiva.md
  ficha: 7_Info_Comercial_Amazon.md

amazon:
  por_defecto: amazon.es
  # País del visitante (ISO 3166-1 alpha-2) → tienda. Lo que no está aquí va a por_defecto.
  marketplaces:
    ES: amazon.es
    MX: amazon.com.mx
    BR: amazon.com.br
    US: amazon.com
    CA: amazon.ca
    GB: amazon.co.uk
    DE: amazon.de
    FR: amazon.fr
    IT: amazon.it
    NL: amazon.nl
    # Resto de Hispanoamérica compra Kindle en amazon.com
    AR: amazon.com
    CO: amazon.com
    CL: amazon.com
    PE: amazon.com
    UY: amazon.com
    EC: amazon.com
    VE: amazon.com
    BO: amazon.com
    PY: amazon.com
    CR: amazon.com
    PA: amazon.com
    DO: amazon.com
    GT: amazon.com
    HN: amazon.com
    SV: amazon.com
    NI: amazon.com
    CU: amazon.com
    PR: amazon.com
  # Etiquetas de Amazon Afiliados por tienda. Vacío = sin afiliado. Comprobar condiciones del programa antes de usar.
  afiliados:
    amazon.es: ""
    amazon.com: ""
    amazon.com.mx: ""

enlaces:
  # URL base del Worker de Cloudflare (enlace universal). Vacío = la web usa su propia página /ir/<slug>/ (sin geolocalización).
  base_url: ""

utm:
  medium_por_defecto: social
  # Nombre corto de canal (parámetro ?c= del enlace universal) → utm_source
  canales:
    ig: instagram
    pin: pinterest
    fb: facebook
    th: threads
    bs: bluesky
    x: x
    yt: youtube
    tt: tiktok
    tg: telegram
    nl: newsletter
    web: web
    pod: podcast

plan:
  zona_horaria: Europe/Madrid
  # Formatos por día de la semana (0 = lunes). Cada entrada es una pieza; el orden fija la hora.
  # Formatos: carrusel (7 imágenes), cita (1 imagen), audio (episodio de pódcast de ~5 min + imagen)
  semana:
    0: [carrusel, cita]
    1: [cita, cita]
    2: [audio, cita]
    3: [cita, cita]
    4: [carrusel, cita]
    5: [cita]
    6: [cita]
  horas: ["12:30", "19:00"]
  # Si el Estratega ha dejado un plan para la semana (kv plan_semana:<lunes>), manda sobre `semana`.
  usar_plan_estratega: true
  # Cuántos días hacia delante se planifica (para que el humano apruebe con margen)
  dias_adelanto: 1
  max_reintentos_redaccion: 2

publicacion:
  # Canales a los que sale cada pieza. Solo actúan los que tengan credenciales en el entorno.
  canales: [telegram, pinterest, instagram, bluesky, threads, x]
  # Excepciones por formato (si no está, se usa `canales`)
  canales_por_formato:
    audio: [podcast, telegram, bluesky, threads, x]
  # Aprobación: manual (todo lo decide el humano) · mixto (se autoaprueban las citas literales sin avisos)
  # · auto (todo lo que pasa el Guardián queda aprobado). En cualquier modo la previa llega a Telegram y
  # se puede cancelar (❌) o devolver al Redactor (✏️) hasta la hora de publicación.
  aprobacion: auto
  # Minutos mínimos entre el aviso en Telegram y la publicación automática (ventana para cancelar).
  antelacion_minima_min: 60
  # Una pieza que el Guardián rechazó alguna vez nunca se autoaprueba: pasa por el humano.
  rechazadas_a_manual: true
  # Las imágenes de las piezas se publican en la web para que Instagram las pueda leer (necesita URL pública).
  ruta_piezas_web: static/piezas
  dias_conservar_piezas: 21
  hashtags_max: 8

podcast:
  titulo: "Kai Zen, cinco minutos"
  descripcion: "Una idea de un libro, leída en voz alta. Cinco minutos, sin promesas y sin prisa."
  autor: Kai Zen
  email: ""
  idioma: es-es
  categoria: "Self-Improvement"
  # Voz neuronal de Edge TTS (gratuita). Alternativas: es-ES-ElviraNeural, es-MX-JorgeNeural, es-MX-DaliaNeural
  voz: es-ES-AlvaroNeural
  velocidad: "-6%"
  ruta_web: static/podcast
  aviso_voz: "Este episodio se ha grabado con una voz sintética a partir del texto del libro."

bibliotecario:
  dias_gratis_por_periodo: 5     # límite de KDP Select por libro cada 90 días
  periodo_dias: 90
  duracion_promo_dias: 2         # cada promoción: días gratis seguidos
  aviso_dias_antes: 14           # KDP pide programar con antelación; el aviso llega con este margen
  fecha_inicio_rotacion: "2026-09-22"
  tokens:
    instagram_dias_validez: 60
    aviso_dias_antes: 10

analista:
  dir_kdp: datos/kdp            # aquí se dejan los CSV descargados de KDP Reports (no se versionan)
  ventana_dias: 30

telegram:
  # Chat (o usuario) que aprueba: se rellena con TELEGRAM_CHAT_APROBACION en el entorno.
  # Canal público de lectores: TELEGRAM_CANAL en el entorno (@nombre o id numérico).
  firma_canal: "— Kai Zen"

newsletter:
  proveedor: mailerlite
  # HTML del formulario incrustado de MailerLite. Vacío = la web muestra un aviso de "próximamente".
  embed_html: ""
  regalo_bienvenida: "Diez sistemas que aguantan un día malo (guía breve derivada de Sistemas para mentes caóticas)"

canales:
  # Usuarios previstos. Se rellenan cuando se reserven (docs/CHECKLIST_CUENTAS.md).
  instagram: ""
  pinterest: ""
  threads: ""
  bluesky: ""
  x: ""
  youtube: ""
  tiktok: ""
  telegram_canal: ""
  facebook_pagina: ""

series:
  mente_distinta:
    activa: true
    nombre_amazon: Mente distinta
    carpeta: 1.Neurodivergente
    tipo: ordenada
    frase: "Ni un test. Ni una vez «es un superpoder»."
    promesa: "Sistemas en lugar de fuerza de voluntad. Herramientas que funcionan un día malo."
    enemigo: "La autoayuda que diagnostica y el discurso del «don»."
    descripcion_corta: >
      Doce libros para cerebros que funcionan distinto: TDAH adulto, alta sensibilidad y autismo
      detectado tarde. Del «no es pereza» a criar a un hijo que procesa el mundo de otra manera.
      Sin tests, sin diagnosticar a nadie y sin llamarlo un don. Sistemas en lugar de fuerza de voluntad.
    nota_enfoque: >
      Esta colección es divulgación y acompañamiento. No diagnostica ni al lector ni a nadie de su
      entorno, no trata y no sustituye a un profesional sanitario. No contiene ningún test.
      En España: 024 (conducta suicida, 24 h), 112 (emergencias), 016 (violencia de género).
