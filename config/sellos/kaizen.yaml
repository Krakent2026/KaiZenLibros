    faq:
      - {p: "¿Hay que leerlos en orden?", r: "No. Cada libro se lee suelto y ninguno da por supuesto que has leído los demás. El número es una ruta sugerida, no un requisito. Si no sabes por dónde empezar, «El arte de conocerte» es la puerta natural."}
      - {p: "¿Prometen cambiar la vida en treinta días?", r: "No. La colección propone entenderte mejor y mover algo pequeño, hoy. No usa la disciplina como castigo ni el descanso como premio."}
      - {p: "¿Son libros de meditación o de religión?", r: "Ni una cosa ni la otra. Son autoayuda práctica sin gurús; hablan desde la mesa de al lado, no desde una tarima. La espiritualidad va en otra serie del sello."}
      - {p: "¿Sustituyen a un profesional?", r: "No. Son divulgación y acompañamiento. Si lo que te pasa es más grande que un libro, conviene consultarlo."}
