# Configuración del sello Kai Zen.
# Todo el sistema (Minero, Redactor, web, enlaces) lee de aquí. Un sello = un fichero.

sello:
  id: kaizen
  nombre: Kai Zen
  autor_amazon: Kai Zen
  tagline: "Leer más no es hacer más."
  idioma: es
  # Cambiar por el dominio propio cuando exista. Con GitHub Pages queda https://<usuario>.github.io/Promocion_IA
  web: "https://krakent2026.github.io/KaiZenLibros"
  contacto_email: ""
  voz: >
    Primera persona cercana y sin género marcado. Directa, validante, con humor seco.
    Nada clínico ni infantilizador. Sin urgencia falsa y sin promesas: se dice de qué
    trata el libro, nunca qué le hará al lector. Kai Zen es una voz de sello, no una
    persona con anécdotas: nunca se inventan vivencias personales.
  # Enlaces públicos que muestra la web (cabecera y pie). Vacío = no se muestra.
  redes:
    instagram: "https://www.instagram.com/zenkai555/"
    telegram: "https://t.me/+0OdDz82oSL02YmRk"
    spotify: "https://open.spotify.com/show/0NZ0KZcBPU2mwNCseANNJP"
    bluesky: ""
    threads: ""
    pinterest: ""
    amazon: ""
  # Página «Sobre Kai Zen». Manifiesto del sello: sin biografía de persona, con método.
  sobre:
    entrada: >
      Kai Zen es un sello editorial independiente. Publica series de libros de divulgación y
      acompañamiento, escritas con una regla que no se rompe en ninguna página: aquí no se
      diagnostica, no se predice y no se promete nada.
    secciones:
      - titulo: Qué escribimos
        texto: >
          Tres series, tres puertas. «Mente distinta» habla del TDAH adulto, de la alta sensibilidad y del
          autismo detectado tarde: sistemas en lugar de fuerza de voluntad. «Crecimiento personal» son
          veintiún libros de autoayuda práctica sin gurús, sin promesas y sin culpa: mirarte, y luego
          moverte un poco. «Los Mensajeros» cuenta como novelas las vidas de quienes trajeron una nueva
          luz a la humanidad, de Krishna a Bahá'u'lláh, sin poner ninguna tradición por encima de otra.
          En preparación: la numerología con rigor histórico y la espiritualidad sin doctrina.
      - titulo: Para quién
        texto: >
          Para quien lleva años oyendo que le falta voluntad, disciplina o ganas, y sospecha que la
          explicación es otra. Para quien convive con alguien así. Para quien desconfía, con razón,
          de la autoayuda que promete resultados en tres semanas. Y para quien se sigue haciendo las
          grandes preguntas, tenga una fe, varias o ninguna.
      - titulo: La regla
        texto: >
          Ningún libro diagnostica a nadie: reconocerse en una descripción no es un diagnóstico, y eso lo
          hace un profesional. Ningún libro predice nada. Ningún libro promete un resultado: se dice de
          qué trata, no qué le va a hacer a quien lo lea. Cuando el libro no puede sostener una cifra con
          seguridad, no la da.
      - titulo: Cómo están hechas las series
        texto: >
          Cerradas, ordenadas y con una puerta de entrada clara. El Libro 1 explica qué es esto por
          dentro; los demás remiten a él y cada uno es dueño de un tema, sin repetir lo que cuentan los
          otros. Cada capítulo termina con un paso concreto. Y todas las herramientas pasan la misma
          prueba: tienen que funcionar un día malo, con pocos pasos y sin mantenimiento diario.
      - titulo: Lo que no vas a encontrar
        texto: >
          Tests. Cifras que no se pueden sostener. La palabra «don» o «superpoder» aplicada a una forma
          de procesar el mundo. Urgencia falsa. Testimonios. Promesas.
      - titulo: Quién firma
        texto: >
          Los libros se firman con el nombre del sello, no con el de una persona. Lo que importa es el
          método y las reglas con que están escritos, no la biografía de quien teclea. Si algo en estas
          páginas te hace sentir acompañado, ese es el único mérito que reclamamos.
      - titulo: Cómo leernos
        texto: >
          Empieza por el Libro 1 de la serie que te toque. Si prefieres una idea cada vez, el canal de
          Telegram publica cada día un fragmento de un libro y el pódcast lee uno en voz alta cada
          semana. El boletín, cuando exista, llegará los viernes.

