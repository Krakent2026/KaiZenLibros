      - {numero: 11, slug: diagnostico-tarde, titulo: "Diagnóstico tarde", subtitulo: "Releer tu historia con la información que faltaba", carpeta: Libro11_Diagnostico_tarde, portada: PUBLICAR_DiagnosticoTarde_PORTADA_EBOOK.jpg, bloque: Convivir, para_que: "Qué hacer con una biografía entera.", asin_ebook: null, asin_papel: null}
