name: Ciclo semanal

on:
  schedule:
    - cron: "0 5 * * 0"   # domingos 05:00 UTC: recordatorios, informe y plan de la semana que empieza el lunes
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para lanzar el despliegue de la web tras subir piezas o artículos

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  semanal:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_APROBACION: ${{ secrets.TELEGRAM_CHAT_APROBACION }}
      TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
      PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_CUENTA_ID: ${{ secrets.INSTAGRAM_CUENTA_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      BLUESKY_USUARIO: ${{ secrets.BLUESKY_USUARIO }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agentes.pipeline semanal
      - name: Guardar cambios
        run: |
          git config user.name "agentes-bot"
          git config user.email "agentes-bot@users.noreply.github.com"
          git add datos/*.sqlite
          if git diff --staged --quiet; then echo "Sin cambios"; else git commit -m "datos: ciclo semanal $(date -u +%F)" && git pull --rebase && git push; fi
      - name: Desplegar la web si hubo cambios
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Los push hechos con GITHUB_TOKEN no disparan otros workflows: se lanza el de la web a mano.
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then gh workflow run "Web del sello" --ref main && echo "web: despliegue lanzado"; else echo "web: sin cambios"; fi
