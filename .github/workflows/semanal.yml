name: Ciclo semanal

on:
  schedule:
    - cron: "0 5 * * 0"   # domingos 05:00 UTC, antes del plan de la semana
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  semanal:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agentes.pipeline semanal
      - name: Guardar cambios en datos
        run: |
          git config user.name "agentes-bot"
          git config user.email "agentes-bot@users.noreply.github.com"
          git add datos/*.sqlite
          if git diff --staged --quiet; then echo "Sin cambios"; else git commit -m "datos: ciclo semanal $(date -u +%F)" && git push; fi
