name: Aprobaciones y publicación

on:
  schedule:
    - cron: "5,35 * * * *"   # cada media hora (el cron de GitHub se retrasa o salta corridas; así llega a tiempo): respuestas de Telegram y publicación de lo vencido
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para lanzar el despliegue de la web tras subir piezas o artículos

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  aprobaciones:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      TELEGRAM_CHAT_APROBACION: ${{ secrets.TELEGRAM_CHAT_APROBACION }}
      TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
      PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
      PINTEREST_TABLERO_ID: ${{ secrets.PINTEREST_TABLERO_ID }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_CUENTA_ID: ${{ secrets.INSTAGRAM_CUENTA_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      BLUESKY_USUARIO: ${{ secrets.BLUESKY_USUARIO }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agentes.pipeline aprobaciones
      - name: Guardar cambios
        run: |
          git config user.name "agentes-bot"
          git config user.email "agentes-bot@users.noreply.github.com"
          git add datos/*.sqlite web/static/piezas web/static/podcast web/contenido/blog
          if git diff --staged --quiet; then echo "Sin cambios"; else git commit -m "datos: aprobaciones $(date -u +%FT%H:%M)" && git pull --rebase && git push; fi
      - name: Desplegar la web si hubo cambios
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Los push hechos con GITHUB_TOKEN no disparan otros workflows: se lanza el de la web a mano.
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then gh workflow run "Web del sello" --ref main && echo "web: despliegue lanzado"; else echo "web: sin cambios"; fi
