name: Web del sello

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "config/**"
      - "agentes/config.py"
      - "herramientas/redirecciones.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      SITIO: https://kaizenlibros.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      # La web vive en la raíz de su dominio (Cloudflare Pages): base /
      - run: python -m web.generar --base-url /
      # Despliegue principal: Cloudflare Pages (proyecto kaizenlibros, dominio kaizenlibros.com)
      - name: Desplegar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy web/dist --project-name kaizenlibros --branch main --commit-dirty=true
      # Alojamiento antiguo (GitHub Pages): solo redirecciones al dominio nuevo, mientras la variable PAGES_ACTIVAS sea "true".
      - if: vars.PAGES_ACTIVAS == 'true'
        run: python herramientas/redirecciones.py --dist web/dist --salida web/dist_redirect --destino "$SITIO"
      - if: vars.PAGES_ACTIVAS == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: vars.PAGES_ACTIVAS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist_redirect

  redirecciones_antiguas:
    if: vars.PAGES_ACTIVAS == 'true'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
